<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tutoring - BODMAS & Pemfaktoran</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #58cc02; --primary-dark: #46a302; --secondary: #1cb0f6; 
            --bg: #f7f7f7; --card-bg: #ffffff; --text: #3c3c3c; --border: #e5e5e5;
            --wrong: #ff4b4b; --wrong-bg: #ffdfe0; --correct: #58cc02; --correct-bg: #d7ffb8;
            --nav-width: 280px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Navbar */
        .navbar { width: var(--nav-width); background: var(--card-bg); border-right: 2px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
        .nav-header { padding: 20px; border-bottom: 2px solid var(--border); text-align: center; }
        .nav-header h2 { color: var(--primary-dark); font-size: 1.2rem; margin-bottom: 5px; }
        .nav-header p { font-size: 0.8rem; color: #777; }
        .reset-btn { width: 100%; padding: 10px; background: var(--wrong); color: white; border: none; border-bottom: 2px solid var(--wrong); cursor: pointer; font-weight: bold; transition: 0.2s; }
        .reset-btn:hover { background: #e04343; }
        .nav-list { flex: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; transition: 0.2s; font-size: 0.9rem; }
        .nav-item:hover { background: #f0f0f0; }
        .nav-item.active { background: #e8f5e1; border-left: 4px solid var(--primary); font-weight: bold; color: var(--primary-dark); }
        .nav-item.completed { color: var(--primary); }
        .nav-item i { margin-right: 10px; font-size: 1.1rem; }
        .nav-sub { font-size: 0.8rem; color: #888; margin-left: 25px; padding: 5px 0; cursor: pointer; }
        .nav-sub.active { color: var(--primary-dark); font-weight: bold; }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .content-wrapper { width: 100%; max-width: 800px; }
        .section-container { display: none; animation: fadeIn 0.4s ease-in-out; }
        .section-container.active { display: block; }
        
        /* Cards & Theory */
        .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 0 rgba(0,0,0,0.05); }
        .card h2 { color: var(--primary-dark); margin-bottom: 15px; display: flex; align-items: center; }
        .card h2 i { margin-right: 10px; color: var(--secondary); }
        .theory-content { line-height: 1.6; font-size: 1.05rem; }
        .theory-content .katex { font-size: 1.2em; }
        .tip-box { background: #fff8e1; border-left: 4px solid #ffca28; padding: 15px; margin: 15px 0; border-radius: 5px; }
        .tip-box strong { color: #f57c00; }

        /* Exercises */
        .exercise-box { background: var(--bg); border: 2px solid var(--border); border-radius: 10px; padding: 20px; margin-top: 20px; position: relative; }
        .question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { padding: 12px; background: var(--card-bg); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: 0.2s; text-align: center; font-size: 1rem; border-bottom: 3px solid var(--border); }
        .option-btn:hover:not(.disabled) { background: #f0f0f0; border-color: #ccc; }
        .option-btn.selected { background: #ddf4ff; border-color: var(--secondary); color: var(--secondary); }
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct-dark); }
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
        .option-btn.disabled { cursor: not-allowed; opacity: 0.8; }
        
        .check-btn { margin-top: 15px; padding: 12px 25px; background: var(--primary); color: white; border: none; border-bottom: 3px solid var(--primary-dark); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .check-btn:hover { filter: brightness(1.1); }
        .check-btn:disabled { background: #ccc; border-color: #999; cursor: not-allowed; }

        /* Feedback Collapsible */
        .feedback { margin-top: 15px; border: 2px solid var(--correct); border-radius: 10px; overflow: hidden; display: none; }
        .feedback.show { display: block; animation: slideDown 0.3s ease; }
        .feedback-header { background: var(--correct-bg); padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--primary-dark); }
        .feedback-body { padding: 15px; background: white; display: none; }
        .feedback-body.show { display: block; }

        /* Navigation Buttons */
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; margin-bottom: 50px; }
        .nav-btn { padding: 12px 30px; border-radius: 10px; border: 2px solid var(--border); border-bottom: 3px solid var(--border); background: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: #f0f0f0; }
        .nav-btn.next { background: var(--primary); color: white; border-color: var(--primary); border-bottom-color: var(--primary-dark); }

        /* SVG Illustrations */
        .svg-illust { text-align: center; margin: 20px 0; }
        
        /* Print Styles */
        @media print {
            body { overflow: visible; background: white; }
            .navbar, .nav-buttons, .check-btn, .option-btn, .reset-btn, .feedback-header, .svg-illust { display: none !important; }
            .main { padding: 0; }
            .section-container { display: block !important; page-break-inside: avoid; }
            .card { box-shadow: none; border: 1px solid #ccc; }
            .exercise-box { border: 1px solid #ccc; background: white; }
            .feedback, .feedback-body { display: block !important; border: none; background: white; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
            .print-table th, .print-table td { border: 1px solid black; padding: 5px; text-align: left; }
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 500px; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-header">
            <h2>MATH TUTORING</h2>
            <p>by Deni</p>
        </div>
        <button class="reset-btn" onclick="resetAll()"><i class="fas fa-redo"></i> Reset Semua Progres</button>
        <div class="nav-list" id="navList">
            <!-- Nav items generated by JS -->
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        <div class="content-wrapper" id="contentWrapper">
            <!-- Content generated by JS -->
        </div>
    </div>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}]});"></script>

    <script>
        // --- DATA STRUCTURE ---
        const sections = [
            { id: "home", title: "Home", icon: "fa-house", sub: [] },
            { id: "sec1", title: "Spiral Review Warm-up", time: "00:00-00:10", icon: "fa-rotate", sub: ["Theory 1", "Exercise 1.1", "Theory 2", "Exercise 1.2", "Theory 3", "Exercise 1.3"] },
            { id: "sec2", title: "Intro & Real-World", time: "00:10-00:15", icon: "fa-globe", sub: ["Theory 1", "Exercise 2.1", "Theory 2", "Exercise 2.2", "Theory 3", "Exercise 2.3"] },
            { id: "sec3", title: "Review of Prior Knowledge", time: "00:15-00:20", icon: "fa-brain", sub: ["Theory 1", "Exercise 3.1", "Theory 2", "Exercise 3.2", "Theory 3", "Exercise 3.3"] },
            { id: "sec4", title: "Problem Introduction", time: "00:20-00:30", icon: "fa-lightbulb", sub: ["Theory 1", "Exercise 4.1", "Theory 2", "Exercise 4.2", "Theory 3", "Exercise 4.3"] },
            { id: "sec5", title: "Guided Practice", time: "00:30-00:45", icon: "fa-hand-holding-heart", sub: ["Theory 1", "Exercise 5.1", "Theory 2", "Exercise 5.2", "Theory 3", "Exercise 5.3"] },
            { id: "sec6", title: "Independent Practice", time: "00:50-01:00", icon: "fa-person-running", sub: ["Theory 1", "Exercise 6.1", "Theory 2", "Exercise 6.2", "Theory 3", "Exercise 6.3"] },
            { id: "asg1", title: "Assignment 1", icon: "fa-file-pen", sub: [] },
            { id: "asg2", title: "Assignment 2", icon: "fa-file-pen", sub: [] },
            { id: "asg3", title: "Assignment 3", icon: "fa-file-pen", sub: [] },
            { id: "asg4", title: "Assignment 4", icon: "fa-file-pen", sub: [] },
            { id: "asg5", title: "Assignment 5", icon: "fa-file-pen", sub: [] },
            { id: "cons", title: "Consolidation & Reflection", time: "01:00-01:05", icon: "fa-flag-checkered", sub: [] }
        ];

        let currentSection = 0;
        let currentSub = 0;
        let progress = JSON.parse(localStorage.getItem('mathProgress')) || {};

        // --- CORE FUNCTIONS ---
        function saveProgress() { localStorage.setItem('mathProgress', JSON.stringify(progress)); }
        
        function resetAll() {
            if(confirm('Yakin ingin mereset semua progres?')) {
                progress = {};
                saveProgress();
                renderNav();
                navigate(0, 0);
            }
        }

        function renderNav() {
            const navList = document.getElementById('navList');
            navList.innerHTML = '';
            sections.forEach((sec, i) => {
                let isCompleted = progress[sec.id] === 'completed';
                let div = document.createElement('div');
                div.className = `nav-item ${i === currentSection ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                div.innerHTML = `<i class="fas ${sec.icon}"></i> <span>${sec.title} ${sec.time ? `(${sec.time})` : ''}</span>`;
                div.onclick = () => navigate(i, 0);
                navList.appendChild(div);

                if (i === currentSection && sec.sub.length > 0) {
                    sec.sub.forEach((s, j) => {
                        let subDiv = document.createElement('div');
                        let subKey = `${sec.id}_sub${j}`;
                        let subCompleted = progress[subKey] === 'completed';
                        subDiv.className = `nav-sub ${j === currentSub ? 'active' : ''} ${subCompleted ? 'completed' : ''}`;
                        subDiv.innerHTML = `${subCompleted ? '✅ ' : ''}${s}`;
                        subDiv.onclick = () => navigate(i, j);
                        navList.appendChild(subDiv);
                    });
                }
            });
        }

        function navigate(secIdx, subIdx) {
            currentSection = secIdx;
            currentSub = subIdx;
            renderNav();
            renderContent();
        }

        function goNext() {
            let sec = sections[currentSection];
            if(currentSub < sec.sub.length - 1) {
                navigate(currentSection, currentSub + 1);
            } else if(currentSection < sections.length - 1) {
                navigate(currentSection + 1, 0);
            }
        }

        function goPrev() {
            if(currentSub > 0) {
                navigate(currentSection, currentSub - 1);
            } else if(currentSection > 0) {
                let prevSec = sections[currentSection - 1];
                navigate(currentSection - 1, prevSec.sub.length - 1);
            }
        }

        function markCompleted() {
            let sec = sections[currentSection];
            let key = sec.sub.length > 0 ? `${sec.id}_sub${currentSub}` : sec.id;
            progress[key] = 'completed';
            
            // Check if whole section is completed
            let allDone = true;
            if(sec.sub.length > 0) {
                for(let i=0; i<sec.sub.length; i++) {
                    if(progress[`${sec.id}_sub${i}`] !== 'completed') allDone = false;
                }
            }
            if(allDone) progress[sec.id] = 'completed';
            saveProgress();
            renderNav();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- EXERCISE GENERATOR ---
        function createExercise(qId, questionHtml, options, correctAnswer, explanationHtml) {
            let shuffledOptions = shuffleArray([...options]);
            let storedAnswer = progress[qId];
            explanations[qId] = explanationHtml; 
            correctAnswers[qId] = correctAnswer; 
            
            return `
                <div class="exercise-box" id="${qId}">
                    <div class="question-text">${questionHtml}</div>
                    <div class="options-container">
                        ${shuffledOptions.map(opt => `
                            <button class="option-btn ${storedAnswer ? 'disabled' : ''} ${storedAnswer ? (opt === correctAnswer ? 'correct' : (storedAnswer === opt ? 'wrong' : '')) : ''}" 
                                data-opt="${opt.replace(/"/g, '&quot;')}" onclick="selectOption('${qId}', this)">${opt}</button>
                        `).join('')}
                    </div>
                    ${storedAnswer ? `
                        <div class="feedback show">
                            <div class="feedback-header" onclick="toggleFeedback('${qId}')">
                                ${storedAnswer === correctAnswer ? '<span>✅ Benar!</span>' : '<span>❌ Salah</span>'} <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="feedback-body show">
                                ${explanationHtml}
                                <div style="margin-top: 15px; text-align: right;">
                                    <button class="nav-btn" onclick="resetExercise('${qId}')" style="padding: 8px 15px; font-size: 0.85rem; background: #fff; border-color: #ccc;">
                                        <i class="fas fa-redo"></i> Coba Lagi
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : `<button class="check-btn" id="btn_${qId}" disabled onclick="checkAnswer('${qId}')">Periksa</button>`}
                </div>
            `;
        }

        function selectOption(qId, btn) {
            if(progress[qId]) return;
            let box = document.getElementById(qId);
            box.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById(`btn_${qId}`).disabled = false;
        }

        function checkAnswer(qId) {
            let correctVal = correctAnswers[qId];
            let box = document.getElementById(qId);
            let selectedBtn = box.querySelector('.option-btn.selected');
            if(!selectedBtn) return;
            
            let userAnswer = selectedBtn.dataset.opt;
            progress[qId] = userAnswer;
            saveProgress();
            markCompleted();

            box.querySelectorAll('.option-btn').forEach(b => {
                b.classList.add('disabled');
                if(b.dataset.opt === correctVal) b.classList.add('correct');
                if(b === selectedBtn && userAnswer !== correctVal) {
                    b.classList.add('wrong');
                    box.classList.add('shake');
                    setTimeout(() => box.classList.remove('shake'), 300);
                }
            });

            selectedBtn.classList.remove('selected');
            let btn = document.getElementById(`btn_${qId}`);
            let explanation = explanations[qId] || "Pahami langkah penyelesaian di atas.";
            
            btn.remove();
            let feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback show';
            
            // Sisipkan tombol Coba Lagi langsung di sini
            feedbackDiv.innerHTML = `
                <div class="feedback-header" onclick="toggleFeedback('${qId}')">
                    ${userAnswer === correctVal ? '<span>✅ Benar!</span>' : '<span>❌ Salah</span>'} <i class="fas fa-chevron-down"></i>
                </div>
                <div class="feedback-body show">
                    ${explanation}
                    <div style="margin-top: 15px; text-align: right;">
                        <button class="nav-btn" onclick="resetExercise('${qId}')" style="padding: 8px 15px; font-size: 0.85rem; background: #fff; border-color: #ccc;">
                            <i class="fas fa-redo"></i> Coba Lagi
                        </button>
                    </div>
                </div>
            `;
            box.appendChild(feedbackDiv);

            // PAKSA KaTeX untuk merender teks matematika di dalam feedback yang baru saja dimunculkan
            if(typeof renderMathInElement === 'function') {
                renderMathInElement(feedbackDiv, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        function toggleFeedback(qId) {
            let body = document.querySelector(`#${qId} .feedback-body`);
            body.classList.toggle('show');
        }

        function resetExercise(qId) {
            delete progress[qId]; // Hapus jawaban dari memory
            saveProgress();
            // Render ulang section saat ini agar UI kembali ke mode "belum dijawab"
            navigate(currentSection, currentSub); 
        }
        
        const explanations = {};
		const correctAnswers = {};

        // --- SECTION 2: INTRO & REAL-WORLD ---
        function renderSection2() {
            let subContent = '';
            switch(currentSub) {
                case 0: // Theory 1
                    markCompleted();
                    subContent = `
                        <div class="card">
                            <h2><i class="fas fa-globe"></i> Urutan Sangat Penting!</h2>
                            <div class="theory-content">
                                <p>Pernah terpikir bagaimana programmer membuat sistem keamanan bank? Mereka menggunakan <strong>algoritma urutan operasi</strong> yang ketat. Jika urutannya salah, hasilnya bisa fatal!</p>
                                <div class="svg-illust">
                                    <svg width="120" height="120" viewBox="0 0 100 100">
                                        <rect x="15" y="20" width="70" height="60" rx="5" fill="#f7f7f7" stroke="#3c3c3c" stroke-width="2"/>
                                        <circle cx="50" cy="40" r="15" fill="none" stroke="#58cc02" stroke-width="3"/>
                                        <rect x="45" y="52" width="10" height="15" fill="#58cc02"/>
                                        <line x1="30" y1="30" x2="70" y2="30" stroke="#e5e5e5" stroke-width="2"/>
                                        <line x1="30" y1="50" x2="70" y2="50" stroke="#e5e5e5" stroke-width="2"/>
                                    </svg>
                                </div>
                                <p>Dalam matematika, urutan ini disebut <strong>BODMAS</strong>. Hari ini, kamu akan belajar dasar "kode" tersebut agar tidak ada kesalahan dalam perhitungan data.</p>
                            </div>
                        </div>`;
                    break;
                case 1: // Exercise 2.1
                    subContent = `
                        <div class="card"><h2>Latihan: Apa Jika Urutan Salah?</h2>
                        ${createExercise('s2e1a', 'Jika kita menghitung $2 + 3 \\times 4$ dari kiri ke kanan (tanpa BODMAS), berapa hasilnya?', ['20', '14', '24', '9'], '20', 'Tanpa BODMAS: $2+3=5$, lalu $5 \\times 4 = 20$. Ini SALAH menurut aturan matematika!')}
                        ${createExercise('s2e1b', 'Menggunakan BODMAS, berapa hasil sebenarnya dari $2 + 3 \\times 4$?', ['14', '20', '24', '12'], '14', 'BODMAS: Perkalian dulu! $3 \\times 4 = 12$, lalu $2 + 12 = 14$.')}
                        ${createExercise('s2e1c', 'Mana yang harus dikerjakan lebih dulu pada ekspresi $10 - 6 : 2$?', ['$6 : 2$', '$10 - 6$', '$10 : 2$', '$6 - 2$'], '$6 : 2$', 'Pembagian (D) lebih dulu dari Pengurangan (S) dalam BODMAS.')}
                        </div>`;
                    break;
                case 2: // Theory 2
                    markCompleted();
                    subContent = `
                        <div class="card">
                            <h2><i class="fas fa-list-ol"></i> Hierarki BODMAS</h2>
                            <div class="theory-content">
                                <p><strong>B</strong>rackets (Kurung) <br>
                                <strong>O</strong>rders (Pangkat/Akar) <br>
                                <strong>D</strong>ivision & <strong>M</strong>ultiplication (Bagi & Kali - <em>setara, kerjakan kiri ke kanan</em>) <br>
                                <strong>A</strong>ddition & <strong>S</strong>ubtraction (Tambah & Kurang - <em>setara, kerjakan kiri ke kanan</em>)</p>
                                <div class="tip-box">
                                    <strong>💡 Tips:</strong> Anggap BODMAS seperti prioritas lift. Kurung adalah VIP, harus masuk duluan. Pangkat adalah tamu kehormatan. Bagi/Kali adalah tamu biasa yang datang bareng, siapa yang di kiri dia duluan.
                                </div>
                            </div>
                        </div>`;
                    break;
                case 3: // Exercise 2.2
                    subContent = `
                        <div class="card"><h2>Latihan: Terapkan BODMAS</h2>
                        ${createExercise('s2e2a', 'Hitung: $8 + 4 \\times 2 - 5$', ['11', '15', '19', '9'], '11', 'Kali dulu: $4 \\times 2 = 8$. Lalu: $8 + 8 - 5 = 16 - 5 = 11$')}
                        ${createExercise('s2e2b', 'Hitung: $20 : 5 + 3$', ['7', '5', '23', '1'], '7', 'Bagi dulu: $20 : 5 = 4$. Lalu: $4 + 3 = 7$')}
                        ${createExercise('s2e2c', 'Hitung: $3^2 - 4$', ['5', '1', '-1', '7'], '5', 'Pangkat dulu: $3^2 = 9$. Lalu: $9 - 4 = 5$')}
                        </div>`;
                    break;
                case 4: // Theory 3
                    markCompleted();
                    subContent = `
                        <div class="card">
                            <h2>Analogi BODMAS di Dunia Nyata</h2>
                            <div class="theory-content">
                                <p>Bayangkan kamu membuat kue. Resep bilang: "Campurkan telur dan gula, KEMUDIAN kocok". Jika Anda kocok dulu baru masukkan gula, kuenya gagal!</p>
                                <p>Begitu juga $(5 + 5) \\times 2$. Kurung menyuruh kita "jumlahkan dulu" baru dikali. Hasilnya 20. Jika kali dulu, hasilnya 15. <strong>Urutan menentukan hasil!</strong></p>
                            </div>
                        </div>`;
                    break;
                case 5: // Exercise 2.3
                    subContent = `
                        <div class="card"><h2>Tantangan BODMAS</h2>
                        ${createExercise('s2e3a', 'Hitung: $50 - 2 \\times 10$', ['30', '480', '40', '50'], '30', 'Kali dulu: $2 \\times 10 = 20$. Lalu: $50 - 20 = 30$')}
                        ${createExercise('s2e3b', 'Hitung: $(12 - 4) : 2$', ['4', '8', '6', '2'], '4', 'Kurung dulu: $12 - 4 = 8$. Lalu: $8 : 2 = 4$')}
                        ${createExercise('s2e3c', 'Hitung: $5 + 5^2$', ['30', '50', '100', '15'], '30', 'Pangkat dulu: $5^2 = 25$. Lalu: $5 + 25 = 30$')}
                        ${createExercise('s2e3d', 'Hitung: $15 - 5 + 3$', ['13', '7', '17', '10'], '13', 'A dan S setara, kerjakan kiri ke kanan: $15-5=10$, lalu $10+3=13$')}
                        </div>`;
                    break;

            return subContent;

        // SECTION 1: Spiral Review
        function renderSection1() {
            let subContent = '';
            switch(currentSub) {
                case 0: markCompleted(); subContent = `<div class="card"><h2><i class="fas fa-rotate"></i> Spiral Review: Desimal</h2><div class="theory-content"><p>Sebelum masuk ke materi utama, mari kita asah otak dengan desimal!</p><p>Perkalian desimal: Kalikan seperti biasa, lalu hitung total angka di belakang koma.</p><p>Contoh: $0.2 \\times 0.3 = 0.06$ (1+1=2 angka di belakang koma).</p></div></div>`; break;
                case 1: subContent = `<div class="card"><h2>Latihan Desimal 1</h2>${createExercise('s1e1a', 'Hitung: $0.15 \\times 0.4 = ...$', ['0.06', '0.60', '0.006', '6'], '0.06', 'Total angka di belakang koma ada 3 (2 dari 0.15, 1 dari 0.4). $15 \\times 4 = 60$. Jadi 3 angka koma: 0.060 = 0.06')}${createExercise('s1e1b', 'Hitung: $2.4 : 0.06 = ...$', ['40', '4', '0.4', '400'], '40', 'Hilangkan koma dengan mengalikan 100. Jadi $240 : 6 = 40$')}${createExercise('s1e1c', 'Hitung: $1.5 \\times 3.9 = ...$', ['5.85', '58.5', '0.585', '4.5'], '5.85', '$15 \\times 39 = 585$. Total angka di belakang koma ada 2. Jadi 5.85')}</div>`; break;
                case 2: markCompleted(); subContent = `<div class="card"><h2>Pembagian Desimal & Konversi</h2><div class="theory-content"><p>Membagi desimal bisa dipermudah dengan menggeser koma pada pembagi dan pembilang sampai pembilang menjadi bilangan bulat.</p><p><strong>Konversi Satuan:</strong> Jika 1 inci = 2.54 cm, maka 10 inci = $10 \\times 2.54$ cm.</p></div></div>`; break;
                case 3: subContent = `<div class="card"><h2>Latihan Desimal 2</h2>${createExercise('s1e2a', 'Sebuah kabel panjangnya 12.5 meter dipotong menjadi 5 bagian sama besar. Berapa panjang tiap bagian?', ['2.5', '25', '0.25', '2.25'], '2.5', '$12.5 : 5 = 2.5$ meter')}${createExercise('s1e2b', 'Jika 1 inci = 2.54 cm, berapa cm panjang layar 10 inci?', ['25.4', '2.54', '254', '0.254'], '25.4', '$10 \\times 2.54 = 25.4$ cm')}${createExercise('s1e2c', 'Hitung: $125 : 8 = ...$', ['15.625', '15.25', '156.25', '1.5625'], '15.625', '$125 : 8 = 15.625$ (Bisa dibagi manual atau diketahui $8 \\times 15 = 120$, sisa 5 menjadi $5.000 : 8 = 0.625$)')}</div>`; break;
                case 4: markCompleted(); subContent = `<div class="card"><h2>Tips Meningkatkan Kecepatan</h2><div class="theory-content"><div class="tip-box"><strong>🚀 Goal Support:</strong> Untuk meningkatkan kecepatan perhitungan, hafalkan perkalian dasar 1-15. Ini akan mempercepat operasi BODMAS nanti!</div></div></div>`; break;
                case 5: subContent = `<div class="card"><h2>Tantangan Kilat</h2>${createExercise('s1e3a', '$0.12 \\times 0.7 = ...$', ['0.084', '0.84', '0.0084', '8.4'], '0.084', '$12 \\times 7 = 84$. Desimal ada 3 digit, jadi 0.084')}${createExercise('s1e3b', '$15 : 0.06 = ...$', ['250', '25', '2500', '2.5'], '250', 'Geser koma 2 langkah: $1500 : 6 = 250$')}${createExercise('s1e3c', '$3.5 \\times 2 = ...$', ['7', '0.7', '70', '6.5'], '7', '$3.5 \\times 2 = 7.0$')}${createExercise('s1e3d', '$1.2 : 0.4 = ...$', ['3', '0.3', '30', '4.8'], '3', '$12 : 4 = 3$')}</div>`; break;
            }
            return subContent;
        }

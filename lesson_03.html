      </div>
    `, contentEn:`
      When facing mixed integer operation problems, use this strategy:
      <br>1. Identify all operations → 2. Prioritize (Parentheses → Multiply/Divide → Add/Subtract) → 3. Solve step by step → 4. Check signs
      <br><strong>Tip:</strong> Write each step on paper. Don't try to calculate everything in your head at once!
    `},

    {type:'exercise', typeEx:'mc', question:'Dalam soal $(-25) + (10 \\times -2)$, operasi mana yang dikerjakan pertama?', questionEn:'In $(-25) + (10 \\times -2)$, which operation is done first?',
      options:['$(-25) + 10$','$10 \\times -2$','$(-25) + (-2)$','Keduanya sekaligus'], answer:'$10 \\times -2$',
      explanation:'Perkalian dalam kurung dikerjakan pertama: $10 \\times (-2) = -20$. Baru kemudian penjumlahan: $(-25) + (-20) = -45$.',
      explanationEn:'Multiplication in parentheses is done first: $10 \\times (-2) = -20$. Then addition: $(-25) + (-20) = -45$.'},
    {type:'exercise', typeEx:'input', question:'Hitunglah $(-3) \\times 8 + (-12) \\div 4 = \\ldots$', questionEn:'Calculate $(-3) \\times 8 + (-12) \\div 4 = \\ldots$',
      answer:'-27', hint:'Kerjakan perkalian dan pembagian terlebih dahulu.',
      explanation:'Perkalian: $(-3) \\times 8 = -24$. Pembagian: $(-12) \\div 4 = -3$. Lalu penjumlahan: $-24 + (-3) = -27$.',
      explanationEn:'Multiplication: $(-3) \\times 8 = -24$. Division: $(-12) \\div 4 = -3$. Then addition: $-24 + (-3) = -27$.'},
    {type:'exercise', typeEx:'mc', question:'Manakah urutan pengerjaan yang <strong>benar</strong> untuk $(-6) + (-2) \\times 5 - (-3)$?', questionEn:'Which is the <strong>correct</strong> order of operations for $(-6) + (-2) \\times 5 - (-3)$?',
      options:[
        '$(-2) \\times 5$ dulu → $(-6)+(-10)$ → $-16-(-3)$',
        '$(-6)+(-2)$ dulu → $(-8) \\times 5$ → $-40-(-3)$',
        '$(-6)+(-2) \\times 5$ sekaligus → kurangi $(-3)$',
        '$(-2) \\times 5 - (-3)$ dulu → tambahkan $(-6)$'
      ], answer:'$(-2) \\times 5$ dulu → $(-6)+(-10)$ → $-16-(-3)$',
      explanation:'Benar! Perkalian dulu: $(-2)\\times 5 = -10$. Lalu dari kiri ke kanan: $(-6)+(-10)=-16$. Terakhir: $-16-(-3)=-16+3=-13$.',
      explanationEn:'Correct! Multiplication first: $(-2)\\times 5 = -10$. Then left to right: $(-6)+(-10)=-16$. Finally: $-16-(-3)=-16+3=-13$.'},

    {type:'theory', content:`
      <h3>Kesalahan Umum yang Harus Dihindari</h3>
      <p>Banyak siswa melakukan kesalahan berikut saat mengerjakan operasi bilangan bulat:</p>
      <ul>
        <li><strong>Kesalahan 1:</strong> Lupa aturan tanda beda → negatif. Contoh: $(-3) \\times 4$ dijawab $12$ (seharusnya $-12$)</li>
        <li><strong>Kesalahan 2:</strong> Mengubah $-a - b$ menjadi $-(a - b)$ padahal seharusnya $-(a + b)$</li>
        <li><strong>Kesalahan 3:</strong> Mengerjakan penjumlahan sebelum perkalian</li>
        <li><strong>Kesalahan 4:</strong> Menyederhanakan $-(-a)$ menjadi $-a$ padahal seharusnya $+a$</li>
      </ul>
      <div class="theory-highlight">
        <strong>Contoh Kesalahan 2:</strong> $-15 - 27$ bukan $-(15 - 27) = 12$, melainkan $-(15 + 27) = -42$.
      </div>
    `, contentEn:`
      Common mistakes to avoid:
      <br>1. Forgetting different signs → negative. Example: $(-3) \\times 4$ answered as $12$ (should be $-12$)
      <br>2. Converting $-a - b$ to $-(a - b)$ when it should be $-(a + b)$       <br>3. Doing addition before multiplication
      <br>4. Simplifying $-(-a)$ to $-a$ when it should be $+a$     `},

    {type:'exercise', typeEx:'tf', question:'$-15 - 27 = -(15 - 27) = 12$', questionEn:'$-15 - 27 = -(15 - 27) = 12$',
      answer:'Salah',
      explanation:'Salah! $-15 - 27 = -(15 + 27) = -42$, bukan $-(15 - 27) = 12$. Mengurangi bilangan positif sama dengan menambahkan negatif.',
      explanationEn:'Incorrect! $-15 - 27 = -(15 + 27) = -42$, not $-(15 - 27) = 12$. Subtracting a positive is the same as adding a negative.'},
    {type:'exercise', typeEx:'mc', question:'Manakah yang <strong>salah</strong>?', questionEn:'Which one is <strong>incorrect</strong>?',
      options:[
        '$-(-8) = 8$',
        '$-3 \\times (-4) = -12$',
        '$-20 \\div 5 = -4$',
        '$0 \\times (-7) = 0$'
      ], answer:'$-3 \\times (-4) = -12$',
      explanation:'$-3 \\times (-4) = 12$ (positif), bukan $-12$. Tiga pilihan lain semuanya benar.',
      explanationEn:'$-3 \\times (-4) = 12$ (positive), not $-12$. The other three options are all correct.'},
    {type:'exercise', typeEx:'cb', question:'Pilih semua kesalahan yang <strong>sering</strong> dilakukan siswa.', questionEn:'Select all <strong>common</strong> student mistakes.',
      options:[
        'Menjawab $(-2)\\times(-3)=-6$',
        'Menjawab $-(-10)=-10$',
        'Mengerjakan $3+4\\times(-2)$ sebagai $7\\times(-2)=-14$',
        'Menjawab $(-6)\\div 2 = 3$'
      ],
      answer:[
        'Menjawab $(-2)\\times(-3)=-6$',
        'Menjawab $-(-10)=-10$',
        'Mengerjakan $3+4\\times(-2)$ sebagai $7\\times(-2)=-14$'
      ],
      explanation:'$(-2)\\times(-3)=6$ (bukan $-6$) ✗. $-(-10)=+10$ (bukan $-10$) ✗. $3+4\\times(-2)=3+(-8)=-5$, bukan $7\\times(-2)=-14$ ✗. Opsi ke-4 memang salah ($-6\\div2=-3$), tapi bukan merupakan kesalahan umum yang dimaksud.',
      explanationEn:'$(-2)\\times(-3)=6$ (not $-6$) ✗. $-(-10)=+10$ (not $-10$) ✗. $3+4\\times(-2)=3+(-8)=-5$, not $7\\times(-2)=-14$ ✗. Option 4 is indeed wrong ($-6\\div2=-3$), but not the common mistake intended.',},

    {type:'theory', content:`
      <h3>Aplikasi Dunia Nyata yang Lebih Kompleks</h3>
      <p>Dalam kehidupan nyata, kita sering menghadapi situasi yang melibatkan <strong>beberapa operasi sekaligus</strong>. Misalnya:</p>
      <div class="theory-highlight">
        <strong>Contoh:</strong> Sebuah perusahaan mengalami kerugian Rp2.000.000 per bulan selama setengah tahun (6 bulan). Berapa total kerugiannya?<br><br>
        Total = $6 \\times (-2.000.000) = -12.000.000$<br>
        Artinya perusahaan rugi total Rp12.000.000.
      </div>
      <p>Perhatikan bahwa "rugi" diubah menjadi bilangan negatif, lalu dikalikan dengan jumlah bulan. Ini menunjukkan bagaimana perkalian bilangan bulat negatif bekerja dalam konteks nyata.</p>
    `, contentEn:`
      In real life, we often face situations involving <strong>multiple operations at once</strong>. For example:
      <br>A company loses Rp2,000,000 per month for half a year (6 months). Total loss = $6 \\times (-2,000,000) = -12,000,000$.
      <br>"Loss" is converted to a negative number, then multiplied by the number of months.
    `},

    {type:'exercise', typeEx:'input', question:'Sebuah perusahaan rugi Rp2.000.000 per bulan selama 6 bulan. Berapa total kerugiannya (tulis angka negatif)?', questionEn:'A company loses Rp2,000,000 per month for 6 months. What is the total loss (write as negative number)?',
      answer:'-12.000.000', hint:'6 × (-2.000.000)',
      explanation:'$6 \\times (-2.000.000) = -12.000.000$. Total kerugian perusahaan adalah Rp12.000.000.',
      explanationEn:'$6 \\times (-2,000,000) = -12,000,000$. The company\'s total loss is Rp12,000,000.'},
    {type:'exercise', typeEx:'mc', question:'Seorang penyelam berada di kedalaman $-20$ m. Ia menyelam lagi $3$ kali lebih dalam dari posisinya sekarang. Kedalaman akhirnya adalah $\\ldots$', questionEn:'A diver is at $-20$ m depth. He dives $3$ times deeper than his current position. His final depth is $\\ldots$',
      options:['$-60$ m','$-23$ m','$-17$ m','$-80$ m'], answer:'$-60$ m',

function renderSidebar(){
  const nav=document.getElementById('sideNav');
  let html='';
  sections.forEach((s,i)=>{
    if(s.type==='home'){
      html+=`<div class="side-item${curSec===i?' active':''}" onclick="goTo(${i})">
        <div class="si-icon"><i class="fa-solid ${s.icon}"></i></div>
        <div class="si-text"><div class="si-title">${s.title}</div></div>
      </div>`;
    } else if(s.type==='assignment'){
      html+=`<div class="side-item${curSec===i?' active':''}" onclick="goTo(${i})">
        <div class="si-icon"><i class="fa-solid fa-clipboard-check"></i></div>
        <div class="si-text"><div class="si-title">Assignment ${s.assignNum}</div></div>
        <span class="si-badge">${s.assignNum}</span>
        <i class="fa-solid fa-circle-check si-check" id="sc-${i}"></i>
      </div>`;
    } else if(s.type==='lesson'){
      html+=`<div class="side-item${curSec===i?' active':''}" onclick="goTo(${i})">
        <div class="si-icon"><i class="fa-solid ${s.icon}"></i></div>
        <div class="si-text"><div class="si-title">${s.title}</div>${s.time?`<div class="si-time">${s.time}</div>`:''}</div>
        <i class="fa-solid fa-circle-check si-check" id="sc-${i}"></i>
      </div>`;
    } else if(s.type==='reflection'){
      html+=`<div class="side-item${curSec===i?' active':''}" onclick="goTo(${i})">
        <div class="si-icon"><i class="fa-solid fa-flag-checkered"></i></div>
        <div class="si-text"><div class="si-title">${s.title}</div></div>
      </div>`;
    }
  });
  nav.innerHTML=html;
  updateSideChecks();
  updateSideProgress();
}

function updateSideChecks(){
  sections.forEach((s,i)=>{
    const el=document.getElementById('sc-'+i);
    if(!el)return;
    const prog=getSecProgress(i);
    el.classList.toggle('visible',prog.done===prog.total&&prog.total>0);
  });
}

function updateSideProgress(){
  let total=0,done=0;
  sections.forEach((s,i)=>{
    const p=getSecProgress(i);
    total+=p.total; done+=p.done;
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('sideProgressFill').style.width=pct+'%';
}

function getSecProgress(si){
  const s=sections[si];
  if(!s.blocks||s.type==='home'||s.type==='reflection')return{total:0,done:0};
  const exs=s.blocks.filter(b=>b.type==='exercise');
  let done=0;
  exs.forEach((_,bi)=>{
    const bIdx=s.blocks.indexOf(_);
    const st=exState[ek(si,bIdx)];
    if(st&&st.answered)done++;
  });
  return{total:exs.length,done};
}

   HEADER UPDATE

function updateHeader(){
  const s=sections[curSec];
  let title='';
  if(s.type==='home')title='MATH TUTORING by Deni';
  else if(s.type==='assignment')title='Assignment '+s.assignNum;
  else title=s.title;
  document.getElementById('headerTitle').textContent=title;

  const prog=getSecProgress(curSec);
  document.getElementById('headerProgressText').textContent=`${prog.done}/${prog.total}`;
  document.getElementById('headerProgressFill').style.width=(prog.total?Math.round(prog.done/prog.total*100):0)+'%';
}

/* ============================================================
   BLOCK RENDERING
   ============================================================ */
function getShuffled(si,bi,opts){
  const key=ek(si,bi);
  if(exState[key]&&exState[key].shuffled)return exState[key].shuffled;
  const sh=shuffle(opts);
  if(!exState[key])exState[key]={};
  exState[key].shuffled=sh;
  return sh;
}

function renderBlock(anim='right'){
  const s=sections[curSec];
  const isAssign=s.type==='assignment';
  const maxBlk=s.blocks.length-1;
  const effMax=isAssign?maxBlk+1:maxBlk;
  if(curBlk<0)curBlk=0;
  if(curBlk>effMax)curBlk=effMax;

  const container=document.getElementById('block-container');

  // Assignment summary
  if(isAssign&&curBlk>maxBlk){
    container.innerHTML=renderAssignSummary(curSec);
    container.firstElementChild&&container.firstElementChild.classList.add('block-enter-fade');
    updateHeader();renderSidebar();updateNavBtns();
    return;
  }
  // Home
  if(s.type==='home'){
    container.innerHTML=renderHome();
    container.firstElementChild&&container.firstElementChild.classList.add('block-enter-fade');
    updateHeader();renderSidebar();updateNavBtns();
    return;
  }
  // Reflection
  if(s.type==='reflection'){
    container.innerHTML=renderReflection(s);
    container.firstElementChild&&container.firstElementChild.classList.add('block-enter-fade');
    updateHeader();renderSidebar();updateNavBtns();
    return;
  }

  const blk=s.blocks[curBlk];
  if(!blk){container.innerHTML='<p>Block tidak ditemukan.</p>';return;}

  let html='';
  if(blk.type==='theory'){
    html=renderTheory(blk);
  } else if(blk.type==='exercise'){
    html=renderExercise(curSec,curBlk,blk);
  }

  container.innerHTML=html;
  const el=container.firstElementChild;
  if(el){
    el.classList.remove('block-enter-right','block-enter-left','block-enter-fade');
    void el.offsetWidth;
    el.classList.add(anim==='left'?'block-enter-left':anim==='fade'?'block-enter-fade':'block-enter-right');
  }
  updateHeader();renderSidebar();updateNavBtns();
}

    const opts=getShuffled(si,bi,ex.options);
    body='<div class="options-list">';
    opts.forEach((o,i)=>{
      const isSel=answered&&norm(userAns)===norm(o);
      const isCor=answered&&norm(o)===norm(ex.answer);

      if(answered){cls+=' locked'; if(isSel&&isCor)cls+=' correct'; else if(isSel&&!isCor)cls+=' wrong'; else if(isCor)cls+=' correct';}

      const icon=answered?(isCor?'<i class="fa-solid fa-check opt-icon" style="color:var(--ok)"></i>':isSel?'<i class="fa-solid fa-xmark opt-icon" style="color:var(--er)"></i>':''):'';

        ${icon}

    body+='</div>';
  } else if(ex.typeEx==='cb'){
    const opts=getShuffled(si,bi,ex.options);
    const selArr=Array.isArray(userAns)?userAns:[];
    body='<div class="options-list">';
    opts.forEach((o,i)=>{
      const isSel=selArr.some(s=>norm(s)===norm(o));
      const isCor=answered&&ex.answer.some(a=>norm(a)===norm(o));
      let cls='opt-btn cb-btn';
      if(answered){cls+=' locked'; if(isSel&&isCor)cls+=' correct'; else if(isSel&&!isCor)cls+=' wrong'; else if(isCor)cls+=' correct';}
      else if(isSel)cls+=' selected';
      const icon=answered?(isCor?'<i class="fa-solid fa-check opt-icon" style="color:var(--ok)"></i>':isSel?'<i class="fa-solid fa-xmark opt-icon" style="color:var(--er)"></i>':''):'';
      body+=`<button class="${cls}" onclick="toggleCb('${key}','${esc(o.replace(/'/g,"\\'"))}',${si},${bi})" ${answered?'disabled':''}>
        <span class="opt-letter">${isSel?'<i class=&quot;fa-solid fa-check&quot; style=&quot;font-size:10px&quot;></i>':letters[i]}</span>
        <span class="opt-text">${pm(o)}</span>
        ${icon}
      </button>`;
    });
    body+='</div>';
	} else if(ex.typeEx==='input'){
		let cls='input-field';
		if(answered){cls+=correct?' correct':' wrong';}
		body+=`<div class="input-row">
		  <input type="text" class="${cls}" id="inp-${key}" value="${userAns||''}" placeholder="Ketik jawaban..." ${answered?'readonly':''} oninput="saveInput('${key}')" onkeydown="if(event.key==='Enter')checkAns(${si},${bi})">
		  ${ex.hint&&!answered?`<span class="input-hint"><i class="fa-solid fa-lightbulb" style="margin-right:4px"></i>${ex.hint}</span>`:''}

	} else if(ex.typeEx==='tf'){

function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

/* ============================================================
   ASSIGNMENT SUMMARY
   ============================================================ */
function renderAssignSummary(si){
  const s=sections[si];
  const exs=s.blocks.filter(b=>b.type==='exercise');
  let score=0;
  let grid='';
  exs.forEach((ex,i)=>{
    const bIdx=s.blocks.indexOf(ex);
    const st=exState[ek(si,bIdx)];
    const ok=st&&st.correct;
    const ans=st&&st.answered;
    if(ok)score++;
    grid+=`<div class="sg-item ${ok?'ok':ans?'er':'na'}">${i+1}</div>`;
  });
  return `<div class="summary-card">
    <div class="summary-score">${score}<span>/${exs.length}</span></div>
    <div class="summary-label">Skor Assignment ${s.assignNum}</div>
    <div class="summary-grid">${grid}</div>
    <button class="print-btn" onclick="printAssign(${si})"><i class="fa-solid fa-print"></i> Print Result</button>
  </div>`;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function selectOpt(key,val,si,bi){
  if(exState[key]&&exState[key].answered)return;
  if(!exState[key])exState[key]={};
  exState[key].userAnswer=val;
  var card=document.getElementById('excard-'+key);
  if(!card)return;
  var opts=exState[key].shuffled;
  card.querySelectorAll('.options-list .opt-btn').forEach(function(btn,i){
    btn.classList.toggle('selected', norm(opts[i])===norm(val));
  });
}
function toggleCb(key,val,si,bi){
  if(exState[key]&&exState[key].answered)return;
  if(!exState[key])exState[key]={userAnswer:[]};
  if(!Array.isArray(exState[key].userAnswer))exState[key].userAnswer=[];
  var arr=exState[key].userAnswer;
  var idx=arr.findIndex(function(a){return norm(a)===norm(val);});
  if(idx>=0)arr.splice(idx,1); else arr.push(val);
  var card=document.getElementById('excard-'+key);
  if(!card)return;
  var opts=exState[key].shuffled;
  var letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  card.querySelectorAll('.options-list .cb-btn').forEach(function(btn,i){
    var isSel=arr.some(function(a){return norm(a)===norm(opts[i]);});
    btn.classList.toggle('selected', isSel);
    btn.querySelector('.opt-letter').innerHTML=isSel
      ?'<i class="fa-solid fa-check" style="font-size:10px"></i>'
      :letters[i];
  });
}
function selectTf(key,val,si,bi){
  if(exState[key]&&exState[key].answered)return;
  if(!exState[key])exState[key]={};
  exState[key].userAnswer=val;
  var card=document.getElementById('excard-'+key);
  if(!card)return;
  card.querySelectorAll('.tf-btn').forEach(function(btn){
    btn.classList.toggle('selected', btn.textContent.trim()===val);
  });
}

function checkAns(si,bi){
  const key=ek(si,bi);
  const ex=sections[si].blocks[bi];
  const st=exState[key];
  if(!st||!st.userAnswer&&st.userAnswer!==0)return;
  if(st.answered)return;

  let correct=false;
  const ua=st.userAnswer;
  if(ex.typeEx==='mc'||ex.typeEx==='tf'){
    correct=norm(ua)===norm(ex.answer);
  } else if(ex.typeEx==='input'){
    correct=norm(ua)===norm(ex.answer);
  } else if(ex.typeEx==='cb'){
    correct=arrEq(ua,ex.answer);
  }

  st.answered=true;
  st.correct=correct;
  saveState();
  renderBlock('fade');

  // Animasi
  setTimeout(()=>{
    const card=document.getElementById('excard-'+key);
    if(!card)return;
    if(correct)showConfetti(card);
    else card.classList.add('shake');
  },50);
}

function toggleExp(header){
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function saveInput(key){
  if(!exState[key])exState[key]={};
  exState[key].userAnswer=document.getElementById('inp-'+key).value;
}

/* ============================================================
   NAVIGASI
   ============================================================ */
function navigate(dir){
  const s=sections[curSec];
  const maxBlk=s.blocks.length-1;
  const isAssign=s.type==='assignment';
  const effMax=isAssign?maxBlk+1:maxBlk;

  if(dir==='next'){
    if(curBlk<effMax){curBlk++;}
    else if(curSec<sections.length-1){curSec++;curBlk=0;}
  } else {
    if(curBlk>0){curBlk--;}
    else if(curSec>0){
      curSec--;
      const ps=sections[curSec];
      curBlk=ps.blocks.length-1;
      if(ps.type==='assignment')curBlk++;
      if(ps.type==='home'||ps.type==='reflection')curBlk=0;
    }
  }
  renderBlock(dir==='next'?'right':'left');
  saveState();
  document.getElementById('main-body').scrollTop=0;
}

function goTo(si){
  const dir=si>=curSec?'right':'left';
  curSec=si;curBlk=0;
  if(sections[si].type==='home'||sections[si].type==='reflection')curBlk=0;
  renderBlock(dir);
  saveState();
  document.getElementById('main-body').scrollTop=0;
  // Tutup sidebar di mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sideOverlay').classList.remove('show');
}

function updateNavBtns(){
  const s=sections[curSec];
  const maxBlk=s.blocks.length-1;
  const isAssign=s.type==='assignment';
  const effMax=isAssign?maxBlk+1:(s.type==='home'||s.type==='reflection'?0:maxBlk);
  document.getElementById('btnPrev').disabled=(curSec===0&&curBlk===0);
  document.getElementById('btnNext').disabled=(curSec===sections.length-1&&curBlk>=effMax);
}

function resetExercise(){
  const s=sections[curSec];
  if(s.type==='home'||s.type==='reflection')return;
  const key=ek(curSec,curBlk);
  if(exState[key])delete exState[key];
  saveState();
  renderBlock('fade');
}

function resetAll(){
  if(!confirm('Yakin ingin menghapus semua kemajuan?'))return;
  Object.keys(exState).forEach(k=>delete exState[k]);
  curSec=0;curBlk=0;
  saveState();
  renderBlock('fade');
}

/* ============================================================
   ANIMASI
   ============================================================ */
function showConfetti(container){
  const colors=['#3FB950','#F0883E','#E6EDF3','#F7D794','#58A6FF'];
  for(let i=0;i<15;i++){
    const d=document.createElement('div');
    d.className='confetti-dot';
    d.style.left=(20+Math.random()*60)+'%';
    d.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDelay=(Math.random()*0.3)+'s';
    d.style.animationDuration=(0.6+Math.random()*0.5)+'s';
    d.style.width=(4+Math.random()*4)+'px';
    d.style.height=d.style.width;
    container.appendChild(d);
    setTimeout(()=>d.remove(),1500);
  }
}

/* ============================================================
   SIDEBAR TOGGLE (MOBILE)
   ============================================================ */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sideOverlay').classList.toggle('show');
}

/* ============================================================
   PRINT ASSIGNMENT
   ============================================================ */
function cleanPrint(text){
  return text
    .replace(/\\ldots/g,'...')
    .replace(/\\times/g,'×')
    .replace(/\\div/g,'÷')
    .replace(/\\cdot/g,'·')
    .replace(/\\pm/g,'±')
    .replace(/\\neq/g,'≠')
    .replace(/\\leq/g,'≤')
    .replace(/\\geq/g,'≥')
    .replace(/\\left/g,'')
    .replace(/\\right/g,'')
    .replace(/\$/g,'');
}
   
function printAssign(si){
  const s=sections[si];
  const exs=s.blocks.filter(b=>b.type==='exercise');
  let score=0, rows='';
  exs.forEach((ex,i)=>{
    const bIdx=s.blocks.indexOf(ex);
    const st=exState[ek(si,bIdx)];
    const ua=st?st.userAnswer:'-';
    const ca=Array.isArray(ex.answer)?ex.answer.join(', '):ex.answer;
    const ok=st&&st.correct;
    if(ok)score++;
    const qText=cleanPrint(pm(ex.question).replace(/<[^>]*>/g,'').trim());
    const uText=Array.isArray(ua)?cleanPrint(ua.join(', ')):cleanPrint(pm(String(ua)));
    const cText=cleanPrint(pm(ca));
    rows+=`<tr>
      <td style="text-align:center">${i+1}</td>
      <td>${qText}</td>
      <td style="text-align:center">${uText}</td>
      <td style="text-align:center">${cText}</td>
      <td style="text-align:center" class="${ok?'c-ok':'c-er'}">${ok?'&#10003;':'&#10007;'}</td>
    </tr>`;
  });

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
@page{size:A4;margin:12mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;font-size:9.5pt;color:#000;line-height:1.4}
h2{font-size:13pt;margin-bottom:4px}
.meta{margin-bottom:6px;font-size:9pt;line-height:1.6}
.meta span{text-decoration:underline;display:inline-block;min-width:140px}
table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{border:1px solid #333;padding:2.5px 4px;text-align:left;font-size:8.5pt;vertical-align:top}
th{background:#eee;font-weight:700;text-align:center;font-size:8pt}
td:nth-child(1),td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:center}
.c-ok{color:green;font-weight:700;font-size:11pt}
.c-er{color:red;font-weight:700;font-size:11pt}
.footer{margin-top:20px;text-align:right;font-size:10pt}
.katex{font-size:8.5pt!important}
</style></head><body>
<h2>MATH TUTORING by Deni</h2>
<div class="meta">
  Name: <span>&nbsp;</span><br>
  Date: <span>&nbsp;</span><br>
  Topic: ${topicInfo.id}<br>
  Assignment Group: ${s.assignNum}<br>
  Score: <strong>${score}/${exs.length}</strong>
</div>
<table>
  <tr><th style="width:25px">No.</th><th>Question</th><th style="width:80px">Student Answer</th><th style="width:80px">Correct Answer</th><th style="width:35px">Note</th></tr>
  ${rows}
</table>
<div class="footer">Checked by,<br><br><br>Deni</div>
</body></html>`;

  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);}
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveState(){
  try{localStorage.setItem('intLessonState',JSON.stringify({exState,curSec,curBlk}));}catch(e){}
}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem('intLessonState'));
    if(d){
      if(d.exState)Object.assign(exState,d.exState);
      if(typeof d.curSec==='number')curSec=d.curSec;
      if(typeof d.curBlk==='number')curBlk=d.curBlk;
    }
  }catch(e){}
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  // Tunggu KaTeX siap
  if(typeof katex==='undefined'){setTimeout(init,100);return;}
  loadState();
  renderSidebar();
  renderBlock('fade');
}
window.addEventListener('DOMContentLoaded',init);
</script>
